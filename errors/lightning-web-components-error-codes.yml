description: 'Error-code registry published by the Lightning Web Components project. LWC is a compiler
  and browser/server runtime rather than an HTTP API, so its error surface is compile-time and run-time
  diagnostics rather than RFC 9457 problem+json responses. Codes use the format "LWC0000: Error message".
  An "error" is blocking and stops compilation, observed in terminal or CLI output; a "warning" is a non-blocking
  diagnostic, observed in the browser web console. Some LWC codes wrap errors from underlying parsers
  (Babel for JavaScript/TypeScript, a CSS parser for stylesheets, a template parser for HTML).'
format: lwc-diagnostic-code
envelope: 'LWC<NNNN>: <message>'
severities:
- error
- warning
transport: compile-time diagnostics (terminal / CLI) and run-time warnings (browser console) — not HTTP
  responses
