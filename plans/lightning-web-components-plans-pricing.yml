description: >-
  Lightning Web Components publishes NO plans and NO pricing, because there is nothing to price.
  LWC is an MIT-licensed open-source framework distributed on npm; there is no hosted service, no
  metered API, no account, no key and no paid tier. Every package in
  packages/lightning-web-components-packages.yml is free to install and free to redistribute under
  the MIT terms. This file replaces a 2026-05-04 bulk-sweep scaffold that invented Free /
  Professional / Enterprise tiers with request quotas and overage pricing for a product that has
  never had any of those things.
plan_count: 0
plans: []
pricing_page:
  published: false
  note: >-
    No pricing page exists for LWC. Salesforce Platform licensing is priced at the parent-brand
    level and governs the org a component is deployed into, not the framework itself — it is not
    recorded as an LWC plan.
license:
  spdx: MIT
  url: https://github.com/salesforce/lwc/blob/master/LICENSE.md
  copyright: Copyright (c) 2026, Salesforce, Inc.
  note: >-
    Two license files ship in the repository — LICENSE.md ("LWC core license") and LICENSE-CORE.md —
    both carrying MIT terms. GitHub's license detector reports NOASSERTION as a result of the dual
    file layout, not because the terms are unclear.
