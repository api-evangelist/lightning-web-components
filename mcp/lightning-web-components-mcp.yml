name: Salesforce DX MCP Server — LWC toolsets
status: published
ownership_note: >-
  The MCP server is published as @salesforce/mcp by Salesforce, LWC's parent, and is documented
  INSIDE the Lightning Web Components Developer Guide with a dedicated `lwc-experts` toolset plus
  LWC-specific Lightning Data Service, SLDS, Aura-migration and Lightning Web Security tool groups.
  LWC is a Salesforce product, so the parent-brand npm scope and docs host are the provider's own
  surface; the tools listed below are the LWC-scoped subset, not the full 60+ DX tool inventory.
deployment:
  mode: local-stdio
  endpoint: null
  install: 'npx -y @salesforce/mcp@latest --orgs DEFAULT_TARGET_ORG --toolsets lwc-experts,aura-experts,experts-validation'
  package: https://www.npmjs.com/package/@salesforce/mcp
  auth: oauth
  verified: searched
  note: >-
    No hosted/remote MCP endpoint is published — the server runs locally over stdio and must be
    installed and started by a human before an agent can reach it. Org access is brokered through
    the Salesforce CLI's stored OAuth connection (`--orgs DEFAULT_TARGET_ORG`). Beta service,
    subject to Salesforce Beta Services Terms. The Agentforce Vibes IDE extension ships it enabled
    by default.
