provider: Lightning Web Components
providerId: lightning-web-components
generated: '2026-08-27'
method: searched
source: https://lwc.dev/guide/ (full open-source developer guide reviewed 2026-08-27 — no rate limits documented, and none possible)
created: '2026-05-04'
modified: '2026-08-27'
tags:
  - Frontend
  - JavaScript
  - Lightning Web Components
  - Salesforce
  - Web Components
description: >-
  Lightning Web Components publishes no rate limits, and cannot: LWC is a compiler and a
  client/server rendering runtime distributed on npm, with no hosted endpoint to throttle, no API
  key to scope a limit to, and no HTTP response in which to signal one. This file replaces a
  2026-05-04 bulk-sweep scaffold that invented per-minute and per-month request quotas, burst
  ceilings, 429 semantics and X-RateLimit-* response headers for a framework that issues no
  requests of its own.
limit_count: 0
limits: []
headers: {}
responseCodes: {}
applicability:
  http_surface: false
  note: >-
    Where a component fetches data on the Salesforce Platform, the governing limits are the
    platform's API request allocations against the org — a Salesforce Platform concern, not an LWC
    one, and deliberately not restated here as if LWC published them.
