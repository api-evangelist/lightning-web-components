aid: lightning-web-components
name: Lightning Web Components
description: >-
  Lightning Web Components (LWC) is Salesforce's MIT-licensed, open-source JavaScript UI
  framework, built directly on native web standards — custom elements, shadow DOM and ES
  modules — rather than on a proprietary component abstraction. It compiles components to
  native custom elements, renders in the browser and on the server, and is the component
  model for the Salesforce Platform as well as a standalone framework for any web app. LWC
  is distributed exclusively through npm: there is no hosted API, no API key, no pricing
  and no rate limit. Its contract surface is a JavaScript API — LightningElement, the @api,
  @track and @wire decorators, lifecycle hooks and wire adapters — accompanied by a
  published 109-code compiler diagnostic registry, a semver versioning and breaking-change
  policy, and a lightning-* base component library of 91 consumer-facing components.
