description: 'Client-side, embeddable UI components published by the Lightning Web Components project. Two distinct
  surfaces: (1) the LWC framework itself, which compiles a component to a native custom element that any page can
  mount; and (2) the lightning-* base component library, a catalogue of ready-made SLDS-styled components distributed
  on npm as lightning-base-components and rendered natively on the Salesforce Platform. Component names below were
  read from the published package file tree, not transcribed from documentation.'
loader:
  model: ES modules — components are imported, not script-tag loaded
  core_import: import { LightningElement } from 'lwc';
  base_component_import: import ... from 'lightning/<component>';
  custom_element_interop: lwc:external renders a third-party custom element inside an LWC template; LWC components
    themselves compile down to HTMLElement subclasses registered via customElements.define().
  cdn:
    available: false
    note: No first-party CDN build is published. Distribution is npm-only; consumers bundle with @lwc/rollup-plugin
      or @lwc/babel-plugin-component.
